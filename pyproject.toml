[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solar-park-ids-rgb-image-capture"
dynamic = ["version"]
description = 'Capture images using an IDS camera.'
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = []
authors = [{ name = "Brian Carlsen", email = "carlsen.bri@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["botocore", "boto3", "ids-peak", "ids-peak-ipl", "influxdb-client-3"]

[project.urls]
Documentation = "https://github.com/unknown/solar-park-ids-rgb-image-capture#readme"
Issues = "https://github.com/unknown/solar-park-ids-rgb-image-capture/issues"
Source = "https://github.com/unknown/solar-park-ids-rgb-image-capture"

[tool.hatch.version]
path = "src/solar_park_ids_rgb_image_capture/__about__.py"

[tool.hatch.envs.default]
dependencies = ["coverage[toml]>=6.5", "pytest"]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = ["- coverage combine", "coverage report"]
cov = ["test-cov", "cov-report"]

[[tool.hatch.envs.all.matrix]]
python = ["3.8", "3.9", "3.10", "3.11", "3.12"]

[tool.hatch.envs.types]
dependencies = ["mypy>=1.0.0"]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/solar_park_ids_rgb_image_capture tests}"

[tool.coverage.run]
source_pkgs = ["solar_park_ids_rgb_image_capture", "tests"]
branch = true
parallel = true
omit = ["src/solar_park_ids_rgb_image_capture/__about__.py"]

[tool.coverage.paths]
solar_park_ids_rgb_image_capture = [
  "src/solar_park_ids_rgb_image_capture",
  "*/solar-park-ids-rgb-image-capture/src/solar_park_ids_rgb_image_capture",
]
tests = ["tests", "*/solar-park-ids-rgb-image-capture/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
